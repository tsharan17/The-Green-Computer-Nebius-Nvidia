# Alembic configuration. The database URL comes from GC_DB_URL (see app/migrations/env.py);
# the app also runs `upgrade head` at start-up unless GC_AUTO_MIGRATE=0.
#
#   .venv/Scripts/python -m alembic upgrade head
#   .venv/Scripts/python -m alembic revision -m "describe the change"

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
