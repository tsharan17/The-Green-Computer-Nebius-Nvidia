[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-computer-backend"
version = "0.7.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "onnx>=1.16",
  "httpx>=0.27",
  "pypdf>=4.0",
  "alembic>=1.13",
  # Required: the local execution backend (real runs, INT8 conversion) uses ONNX Runtime on CPU.
  "onnxruntime>=1.18",
  # Figures: thermal, energy, memory and throughput maps are drawn with matplotlib and seaborn.
  "matplotlib>=3.9",
  "seaborn>=0.13",
]

[project.scripts]
gc = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
# Optional OCR for scanned datasheets (also needs the tesseract binary).
ocr = ["pytesseract>=0.3", "pymupdf>=1.24"]
# PostgreSQL in production (SQLite needs nothing extra).
postgres = ["psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP042"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/**/*.yaml", "legal/*.md", "data/**/*.json", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["migrations/"]
