# Cooling catalogue. Each entry describes a CLASS of cooling solution with typical ranges, not a
# specific product. Values are engineering estimates for planning; confirm with the chosen part's
# datasheet and a thermal measurement before relying on them.
#
#   applies_to      device kinds the entry is sized for
#   r_th_k_per_w    junction-to-ambient thermal resistance for that class (low / typical / high)
#   r_th_factor     instead of r_th: a multiplier on the cooling already fitted (modifiers)
#   active_w        electrical power of fans/pumps, W (typical)
#   c_th_j_per_k    lumped thermal capacitance (sets warm-up time)
#   cost_usd        unit cost range, USD
#   noise_dba       at 1 m, typical
#   embodied_kgco2e cradle-to-gate estimate of the cooling hardware itself (materials x factor)
#   lifetime_years  service life before replacement of the limiting part
#   confidence      how good these numbers are: medium = typical vendor ranges; low = rough estimate
#   source          where the ranges come from (category, not a citation of one product)
#
# v2 (catalogue version 2, additive):
#   targets         heat sources the class removes heat from: compute (die), memory, power (regulators)
#   heat_w_max      upper end of the heat load the class is sized for, W
#   needs           what the place it runs must allow: free_air (open fins), airflow (a fan path),
#                   radiator_airflow, vents, board_change, datacenter, facility_water
#   height_mm       typical height above the board, mm (0 = no added height)
#   repairability   high / medium / low: can a technician fix or replace the limiting part
#   hazardous       materials that need special handling at end of life
#   water_l_per_year  on-site water use; null = depends on the facility (not estimated here)
#
# Embodied carbon uses round material factors: primary aluminium ~10 kgCO2e/kg (recycled ~1),
# copper ~4 kgCO2e/kg, fans/pumps/electronics ~1-3 kgCO2e each. Low confidence by design.

entries:
  - id: mcu-bare-board
    name: Bare board (no heatsink)
    type: passive
    applies_to: [mcu]
    r_th_k_per_w: {low: 35, typical: 45, high: 60}
    active_w: 0
    c_th_j_per_k: 4
    cost_usd: {low: 0, high: 0}
    noise_dba: 0
    materials: "PCB copper only"
    embodied_kgco2e: 0.0
    recyclability: high
    maintainability: "Nothing to maintain."
    lifetime_years: 15
    confidence: medium
    source: "Typical junction-to-ambient values in MCU datasheets for LQFP/BGA packages on a 4-layer board."
    # v2
    targets: [compute, memory, power]
    heat_w_max: 0.6
    needs: []
    height_mm: 0
    repairability: high
    hazardous: "none"
    water_l_per_year: 0

